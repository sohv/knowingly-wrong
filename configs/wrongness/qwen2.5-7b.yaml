# The wrongness ladders for one model: chain, buckets, held-out split, correct-answer controls
# Usage:
#   python src/wrongness/chain.py configs/wrongness/qwen2.5-7b.yaml
#   python src/wrongness/heldout.py configs/wrongness/qwen2.5-7b.yaml
#   python src/wrongness/controls.py configs/wrongness/qwen2.5-7b.yaml

output_dir: output/wrongness
tag: qwen2.5-7b
# the model under study writes every answer (on-policy): an OpenAI-compatible server, e.g.
#   vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000
# leave base_url empty to sample through OpenRouter instead
writer:
  model: Qwen/Qwen2.5-7B-Instruct
  base_url: http://localhost:8000/v1
  request_body: {}
domains: [maths, trivia, cooking, sports]
trivia_source: hf:knowingly-wrong/wrongness:source/trivia.jsonl  # {id, question, gold} per line
source_n: 5500  # authored cooking / sports questions
buckets: 5
n_per_arm: 1672
heldout_n: 200
seed: 0
concurrency: 32
